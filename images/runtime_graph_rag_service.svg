<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="640" viewBox="0 0 1300 640">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 19px Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 15px Arial, sans-serif; fill: #334155; }
      .svc { fill: #eef2ff; stroke: #3730a3; stroke-width: 2; rx: 14; }
      .store { fill: #f0fdf4; stroke: #166534; stroke-width: 2; rx: 14; }
      .line { stroke: #334155; stroke-width: 2.4; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="40" y="50" class="title">Runtime: Graph RAG service (thiết kế gọn)</text>

  <rect x="70" y="120" width="200" height="90" class="svc"/>
  <text x="110" y="172" class="label">Client / UI</text>

  <rect x="330" y="120" width="210" height="90" class="svc"/>
  <text x="380" y="172" class="label">Kong/API</text>

  <rect x="590" y="100" width="280" height="130" class="svc"/>
  <text x="640" y="153" class="label">QnA Service</text>
  <text x="630" y="180" class="small">Flask + GraphLawPipeline</text>

  <rect x="930" y="70" width="300" height="100" class="store"/>
  <text x="985" y="128" class="label">Neo4j Graph + Vector</text>

  <rect x="930" y="200" width="300" height="100" class="store"/>
  <text x="1035" y="258" class="label">Redis Cache</text>

  <rect x="930" y="330" width="300" height="100" class="store"/>
  <text x="998" y="388" class="label">LLM Gateway</text>

  <rect x="930" y="460" width="300" height="100" class="store"/>
  <text x="990" y="518" class="label">MySQL History</text>

  <line x1="270" y1="165" x2="330" y2="165" class="line"/>
  <line x1="540" y1="165" x2="590" y2="165" class="line"/>

  <line x1="870" y1="135" x2="930" y2="120" class="line"/>
  <line x1="870" y1="165" x2="930" y2="250" class="line"/>
  <line x1="870" y1="190" x2="930" y2="380" class="line"/>
  <line x1="870" y1="220" x2="930" y2="510" class="line"/>

  <text x="70" y="280" class="small">Luồng chính: Request → Query Analysis → Retrieval → LLM Answer → Save history + cache.</text>
  <text x="70" y="310" class="small">Thiết kế tập trung 1 Graph RAG service, giảm phân mảnh runtime.</text>
</svg>
